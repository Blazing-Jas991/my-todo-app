<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="body">
    <aside>
        <nav>
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>circle-outline</title><path d="M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" /></svg>
                <p>Jasinski</p>
            </div>
            <div class="icons">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>plus-circle</title><path d="M17,13H13V17H11V13H7V11H11V7H13V11H17M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" /></svg>
                    <button class="icon-button" id="add-btn">Add Task</button>
                </div>
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>magnify</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
                    <button class="icon-button" id="search-btn">Search</button>             
                </div>
                <div autofocus tabindex="0">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>inbox-arrow-down</title><path d="M16,10H14V7H10V10H8L12,14M19,15H15A3,3 0 0,1 12,18A3,3 0 0,1 9,15H5V5H19M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3Z" /></svg>
                    <button class="icon-button" id="inbox-btn">Inbox</button>
                </div>
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>calendar-blank</title><path d="M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H18V1" /></svg>
                    <button class="icon-button" id="today-btn">Today</button>
                </div>
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>calendar-month</title><path d="M9,10V12H7V10H9M13,10V12H11V10H13M17,10V12H15V10H17M19,3A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H5C3.89,21 3,20.1 3,19V5A2,2 0 0,1 5,3H6V1H8V3H16V1H18V3H19M19,19V8H5V19H19M9,14V16H7V14H9M13,14V16H11V14H13M17,14V16H15V14H17Z" /></svg>
                    <button class="icon-button" id="upcoming-btn">Upcoming</button>
                </div>
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>chart-areaspline</title><path d="M17.45,15.18L22,7.31V19L22,21H2V3H4V15.54L9.5,6L16,9.78L20.24,2.45L21.97,3.45L16.74,12.5L10.23,8.75L4.31,19H6.57L10.96,11.44L17.45,15.18Z" /></svg>
                    <button class="icon-button" id="reporting-btn">Reporting</button>
                </div>
            </div>
            <div>
                <p class="projects">My Projects</p>
            </div>
        </nav>
    </aside>
    <main>
        <div id="content-container"> 
            <ul id="task-list"></ul>
        </div>
        
        <div id="new-task">
            <p>Capture now, plan later</p>
            <p>Here is your go-to spot for quick task entry. Clear your mind now, organize when you're ready.</p>
            <button class="add-task-button">+ Add Task</button>

        </div>
    </main>
    <dialog id="dialog">
            <div id="dialog-container">
                <form action="post" id="task-form">
                    <input type="text" id="title-input" placeholder="Name Your Task" name="task-title">
                    <input type="text" id="description-input" placeholder="Describe Your Task" name="task-description">
                
                    <div id="options-container">
                        <div class="options-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>calendar-range</title><path d="M9,10H7V12H9V10M13,10H11V12H13V10M17,10H15V12H17V10M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V8H19V19Z" /></svg>
                            <button type="button" id="date-button">Date</button>
                        </div>
                        <div class="options-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>paperclip</title><path d="M17,7V17.5C17,20.54 14.54,23 11.5,23C8.46,23 6,20.54 6,17.5V6C6,3.79 7.79,2 10,2C12.21,2 14,3.79 14,6V16.5C14,17.88 12.88,19 11.5,19C10.12,19 9,17.88 9,16.5V7H10V16.5C10,17.33 10.67,18 11.5,18C12.33,18 13,17.33 13,16.5V7.15L13,7V6C13,4.34 11.66,3 10,3C8.34,3 7,4.34 7,6V16.44L7,17.5C7,20 9,22 11.5,22C14,22 16,20 16,17.5V7H17Z" /></svg>
                            <button type="button" id="attachment-button">Attachment</button>
                        </div>
                        <div class="options-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>flag</title><path d="M14.4,6L14,4H5V21H7V14H12.6L13,16H20V6H14.4Z" /></svg>
                            <button type="button" id="priority-button">Priority</button>
                        </div>
                        <div class="options-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>alarm-note</title><path d="M17.4,1.86L16.11,3.39L20.71,7.25L22,5.72L17.4,1.86M6.6,1.86L2,5.71L3.29,7.24L7.88,3.39L6.6,1.86M12,4A9,9 0 0,0 3,13A9,9 0 0,0 12,22C12.33,22 12.67,22 13,21.94V19.94C12.67,20 12.33,20 12,20A7,7 0 0,1 5,13A7,7 0 0,1 12,6C15.1,6 17.83,8.03 18.71,11H20.78C19.85,6.9 16.2,4 12,4M23,15H20V20.5A2.5,2.5 0 0,1 17.5,23A2.5,2.5 0 0,1 15,20.5A2.5,2.5 0 0,1 17.5,18C18.04,18 18.57,18.18 19,18.5V13H23V15M11.5,8V13.25L7.5,15.62L8.25,16.85L13,14V8H11.5Z" /></svg>
                            <button type="button" id="reminder-button">Reminder</button>
                        </div>
                    </div>
                    <div id="buttons-holder">
                        <button type="reset" id="cancel-task">Cancel</button>
                        <button type="submit" id="add-task">Add Task</button>
                    </div>
                </form>
            </div>
        </dialog>
        <dialog id="date-dialog">
            <header id="date-picker-header">
                <button id="prev-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>menu-left</title><path d="M14,7L9,12L14,17V7Z" /></svg></button>
                <div id="month-displayer">Month / Year</div>
                <button id="next-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="25" width="25"><title>menu-right</title><path d="M10,17L15,12L10,7V17Z"/></svg></button>
            </header>
            <section id="days-of-week">
                <p>Mon</p>
                <p>Tue</p>
                <p>Wed</p>
                <p>Thur</p>
                <p>Fri</p>
                <p>Sat</p>
                <p>Sun</p>
            </section>
            <section id="days-container">

            </section>
            <section id="time-picker-container">
                <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>menu-up</title><path d="M7,15L12,10L17,15H7Z" /></svg></button>
                <div id="time-picker"></div>
                <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20" width="20"><title>menu-down</title><path d="M7,10L12,15L17,10H7Z" /></svg></button>
            </section>
        </dialog>
    <script type="module" src="./index.js"></script>
</body>
</html>
